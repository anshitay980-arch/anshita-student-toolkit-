<!DOCTYPE html>
<html lang="en">

    <!-- PWA Requirements -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="./icon-192.png">

<!-- Register Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered!'))
        .catch(err => console.log('SW Registration Failed:', err));
    });
  }
</script>

            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #a18cd1 100%);
            position: relative;
            text-align: center;
            box-sizing: border-box;
        }

        .top-left-label {
            font-size: 20px;
            color: #333333;
            top: 15px;
            left: 15px;
            position: absolute;
        }

        p {
            color: #333333;
            font-size: 50px;
            margin: 10px 0;
            font-weight: bold;
        }

        h1 {
            margin: 10px 0;
            font-weight: 900;
            font-size: 3rem;
            color: #333;
        }

        a.get-started-btn {
            display: inline-block;
            padding: 15px 40px;

        <h2 class="greeting">Good afternoon. Ready to manage everything systematically?</h2>
        <h1 class="main-title">Student toolkit</h1>
        <h2 class="sub-title">For youngers</h2>
        <a href="Dashboard.html" class="get-started-btn">Get started</a>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
