<html>
  <head>
    <meta name="viewport" content="width= device-width initial-scale =1.0">
    <title>Study Flashcards</title>
    <link rel ="stylesheet" href="flashcard.css"> 
  </head>
<body> 
    <div class="student-toolkit">
      <h1>Study Flashcards</h1>
  <div class="study-flashcards" id ="flashcard">
    <div class="card-front">Front</div>
      <div class="card-back">Back</div>
  </div>
    <div class="nav-controls">
      <button id="prev-btn">Prev</button>
      <button  id="flip-btn">Flip </button>
      <button id="next-btn">Next</button>
      <button id="delete-btn">Delete</button>
    </div>
<input id="front-input" type="text"placeholder="Enter front (term/ques)">
<input id="back-input" type="text"placeholder="Enter back(Definitions/ans)">
 <div class="card-form">     
   <button id="add-btn" class="card-btn">+Add To Deck</button> 
</div>  
      <script src="flashcard.js" defer>
      </script>
</body>
</html>
